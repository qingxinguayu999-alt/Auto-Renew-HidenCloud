name: Custom HidenCloud Renew

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run HidenCloud renew
        env:
          EMAIL: ${{ secrets.EMAIL }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
        run: python renew.py
